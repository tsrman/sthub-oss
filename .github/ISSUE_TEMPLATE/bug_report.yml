name: Bug report
description: Report reproducible unexpected behavior.
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; use SECURITY.md.
  - type: textarea
    id: environment
    attributes: {label: Environment}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version or commit}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected result}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual result}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, tokens, and other secrets.
    validations: {required: false}
