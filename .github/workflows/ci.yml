name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the in-flight run for the same ref; image builds are the
# expensive part and there is no value in finishing a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run release hygiene checks
        run: |
          python -m unittest scripts.tests.test_check_release scripts.tests.test_verify_compose -v
          python scripts/check_release.py .

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            streamlit-base/requirements.txt
      - name: Install dependency auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Audit Streamlit base dependencies
        run: pip-audit -r streamlit-base/requirements.txt

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # tests/test_files_api.py and tests/test_streamlits_api.py are integration
    # tests that create their own databases on this instance at collection time.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: streamlit
          POSTGRES_PASSWORD: streamlit
          POSTGRES_DB: streamlit_registry
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U streamlit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint backend
        run: |
          ruff check .
          ruff format --check .
      - name: Test backend
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Render and validate HTTP Compose stack
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --format json > compose.http.json
          python scripts/verify_compose.py compose.http.json
      - name: Render and validate TLS Compose stack
        run: |
          docker compose -f compose.tls.yaml config --format json > compose.tls.json
          python scripts/verify_compose.py --tls compose.tls.json

  e2e:
    # The stack build pulls scipy/scikit-learn/matplotlib into the base image, so
    # this job costs many minutes. Run it where it pays off rather than on every
    # push to a branch; use "Run workflow" to check a PR before merging.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the stack
        run: |
          cp .env.example .env
          docker build -t streamlit-base:latest ./streamlit-base
          docker compose up --build -d --wait
      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        run: npm test
      - name: Collect stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 400
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: sthub-backend:ci
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          tags: sthub-worker:ci
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: sthub-frontend:ci
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build Streamlit base image
        uses: docker/build-push-action@v6
        with:
          context: ./streamlit-base
          file: ./streamlit-base/Dockerfile
          tags: streamlit-base:ci
          push: false
          cache-from: type=gha,scope=streamlit-base
          cache-to: type=gha,mode=max,scope=streamlit-base
