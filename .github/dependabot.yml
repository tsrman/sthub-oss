version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    ignore:
      # arq 0.28.0 requires redis[hiredis]<6, so a redis major cannot resolve
      # here at all. Drop this once arq widens the constraint upstream.
      - dependency-name: redis
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    directory: /streamlit-base
    schedule: {interval: weekly}
  # Base images in the Dockerfiles. Note this does not cover the service image
  # tags in compose.yaml / compose.tls.yaml — review those by hand on upgrades.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /streamlit-base
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /e2e
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
